name: Publish

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump (ignored when next_version is set)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      next_version:
        description: 'Optional next version (major, major.minor, or major.minor.patch). Overrides bump_type when set. Use 0.NNN.1 after merging upstream rNNN. For a hotfix of an older line, set this to 0.NNN.x (must be greater than that line's last tag, not latest).'
        required: false
        type: string
      tag:
        description: 'npm dist-tag (leave empty for latest). Use rNNN for an older-line hotfix so latest is unchanged.'
        required: false
        default: ''
        type: string

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version: 24
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org/'
          provenance: false

      - name: Install dependencies
        run: pnpm install --filter=!tsl-testing

      # WITH_GENESYS
      - name: Install bump CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/bump-cli" --silent commander tsx
          ln -sfn "$RUNNER_TEMP/bump-cli/node_modules" "$GITHUB_WORKSPACE/scripts/node_modules"

      - name: Bump version
        id: bump-version
        env:
          NEXT_VERSION: ${{ github.event.inputs.next_version }}
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: |
          set -euo pipefail
          ARGS=("types/three")
          if [ -n "${NEXT_VERSION:-}" ]; then
            ARGS+=(--next-version "$NEXT_VERSION")
          else
            ARGS+=("$BUMP_TYPE")
          fi
          "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts "${ARGS[@]}"
      # !WITH_GENESYS

      - name: Run type check
        run: pnpm run type-check

      # WITH_GENESYS
      - name: Publish package
        id: publish-package
        working-directory: types/three
        env:
          NPM_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          attempt=1
          TAG_ARGS=()
          if [ -n "${NPM_TAG:-}" ]; then
            TAG_ARGS+=(--tag "$NPM_TAG")
          fi
          while true; do
            if npm publish --access public --provenance=false "${TAG_ARGS[@]}"; then
              break
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "Publish failed after ${attempt} attempts"
              exit 1
            fi
            echo "Publish failed; bumping patch from local version (attempt ${attempt})"
            (cd "$GITHUB_WORKSPACE" && "$RUNNER_TEMP/bump-cli/node_modules/.bin/tsx" scripts/bump-package-version.ts types/three patch --from-local)
            attempt=$((attempt + 1))
          done
          echo "published_version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag published version
        uses: ./.github/actions/push-git-tag
        with:
          tag: ${{ steps.bump-version.outputs.package_name }}/${{ steps.publish-package.outputs.published_version }}
          message: Publish ${{ steps.bump-version.outputs.package_name }}@${{ steps.publish-package.outputs.published_version }} to npm
      # !WITH_GENESYS

      - name: Verify published package
        run: |
          PACKAGE_NAME="${{ steps.bump-version.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.publish-package.outputs.published_version }}"

          # Create temp directory and try installing
          TEMP_DIR=$(mktemp -d)
          echo "Created temp directory: $TEMP_DIR"

          cd "$TEMP_DIR"
          npm init -y

          # Retry npm install until the version is available (registry propagation can lag)
          TAG="${{ github.event.inputs.tag }}"
          if [ -n "$TAG" ]; then
            INSTALL_SPEC="$PACKAGE_NAME@$TAG"
          else
            INSTALL_SPEC="$PACKAGE_NAME@$PACKAGE_VERSION"
          fi
          echo "Waiting for $INSTALL_SPEC to be available on npm registry..."
          for i in {1..100}; do
            if npm install "$INSTALL_SPEC" 2>/dev/null; then
              echo "Package available and installed on attempt $i"
              break
            fi
            echo "Attempt $i: Package not yet available, waiting 5s..."
            sleep 5
            if [ "$i" -eq 100 ]; then
              echo "❌ Package never became available after 100 attempts"
              exit 1
            fi
          done

          # Verify installation succeeded
          NODE_MODULES_PATH="node_modules/$PACKAGE_NAME"
          if [ -d "$NODE_MODULES_PATH" ]; then
            INSTALLED_VERSION=$(node -p "require('./$NODE_MODULES_PATH/package.json').version")
            if [ "$INSTALLED_VERSION" == "$PACKAGE_VERSION" ]; then
              echo "✅ Successfully verified installation of $PACKAGE_NAME@$INSTALLED_VERSION"
            else
              echo "❌ Version mismatch: expected $PACKAGE_VERSION, got $INSTALLED_VERSION"
              exit 1
            fi
          else
            echo "❌ Package was not installed correctly"
            exit 1
          fi

          # Cleanup
          cd -
          rm -rf "$TEMP_DIR"

      - name: Notify Slack
        if: always()
        run: |
          # Determine overall status
          JOB_STATUS="${{ job.status }}"
          PACKAGE_NAME="${{ steps.bump-version.outputs.package_name }}"
          PACKAGE_VERSION="${{ steps.publish-package.outputs.published_version }}"
          if [ -z "$PACKAGE_VERSION" ]; then
            PACKAGE_VERSION="${{ steps.bump-version.outputs.new_version }}"
          fi

          if [ "$JOB_STATUS" == "success" ]; then
            OVERALL_STATUS="✅ *$PACKAGE_NAME Publish Succeeded!*"
            COLOR="good"
          else
            OVERALL_STATUS="❌ *$PACKAGE_NAME Publish Failed!*"
            COLOR="danger"
          fi

          # Get commit info
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_AUTHOR=$(git log -1 --pretty=%an)
          COMMIT_SHA=$(git rev-parse --short HEAD)

          curl -X POST "${{ secrets.GENESYS_SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [
                {
                  \"color\": \"$COLOR\",
                  \"title\": \"$OVERALL_STATUS\",
                  \"text\": \"$PACKAGE_NAME publish workflow completed\",
                  \"fields\": [
                    {
                      \"title\": \"Version\",
                      \"value\": \"$PACKAGE_VERSION\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Status\",
                      \"value\": \"$JOB_STATUS\",
                      \"short\": true
                    },
                    {
                      \"title\": \"Commit\",
                      \"value\": \"<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|$COMMIT_SHA: $COMMIT_MSG>\",
                      \"short\": false
                    },
                    {
                      \"title\": \"Author\",
                      \"value\": \"$COMMIT_AUTHOR\",
                      \"short\": true
                    }
                  ],
                  \"footer\": \"GitHub Actions\",
                  \"footer_icon\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                  \"actions\": [
                    {
                      \"type\": \"button\",
                      \"text\": \"View Workflow\",
                      \"url\": \"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
                    }
                  ]
                }
              ]
            }"
